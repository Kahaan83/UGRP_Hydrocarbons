# ASTM Fuel Specifications (ASTM D1655 Jet A, ASTM D975 Diesel No. 2-D, ASTM D4814 Gasoline)
version: "3.0"
description: "US ASTM Fuel Specifications for Aviation, Compression-Ignition, and Spark-Ignition Fuels"

scope:
  modeled_properties:
    - density_15C_kg_m3
    - kin_visc_cSt
    - flash_point_C
    - freezing_point_C
    - pour_point_C
    - cloud_point_C
    - dcn
    - ron
    - mon
    - dvpe_kPa
    - nhoc_MJ_kg
    - aromatics_wt_pct
    - distillation_T50_C
  unmodeled_properties:
    - sulfur_content_ppm
    - lubricity_hfrr_um
    - cfpp_C
    - existent_gum_mg_100ml
    - oxidation_stability_minutes
    - electrical_conductivity_pS_m
    - smoke_point_mm
  scope_statement: >
    Unmodeled properties (sulfur, lubricity, CFPP, gum, oxidation stability, conductivity, smoke point)
    depend primarily on refinery hydrotreating severity, natural polar surfactants, and finishing additive
    chemistry rather than bulk hydrocarbon thermodynamic properties. These are qualified post-blending
    using standardized finishing additive packages (SDA, CI/LI, AO, MDA).

families:
  jet_a:
    standard: "ASTM D1655"
    grade: "Jet A"
    constraints:
      density_15C_kg_m3:
        min: 775.0
        max: 840.0
        test_method: "ASTM D4052"
        uncertainty_margin: 8.0  # Conformal 90% margin
      flash_point_C:
        min: 38.0
        test_method: "ASTM D56"
        uncertainty_margin: 4.2  # Conformal 90% margin
      freezing_point_C:
        max: -40.0
        test_method: "ASTM D5972"
        uncertainty_margin: 5.0  # Conformal 90% margin
      kin_visc_m20C_cSt:
        max: 8.0
        test_method: "ASTM D445"
        uncertainty_margin_factor: 1.25  # 1.25x or +0.15 log units
      nhoc_MJ_kg:
        min: 42.8
        test_method: "ASTM D4809"
        uncertainty_margin: 0.28
      aromatics_wt_pct:
        max: 25.0
        test_method: "ASTM D1319"
      # v5 Task 1.3: D7566 Table 1 aromatics 8.0-25.0 vol %.  Used ONLY when a design is run with --synthetic-blend
      # (applies_to: synthetic_blend; engine_v4.load_spec drops it otherwise).  Secondary source only (D7566-12a); standard text not read.
      aromatics_vol_pct:
        min: 8.0
        max: 25.0
        source: "D7566 Table 1 (checked by user against the standard 2026-11-14)"
        verification: verified
        applies_to: synthetic_blend
      # v4 Task 14. D1655 Table 1: smoke point >= 25.0 mm, OR >= 18.0 mm AND naphthalenes <= 3.00 vol %
      # (D1322 / D1840). Limits confirmed only from secondary sources (supplier specification sheets that
      # cite D1655-15/-19, found via web search 2026-11-10); the ASTM standard text itself was NOT read.
      # Confirm against the current D1655 edition before relying on them.
      smoke_point_mm:
        min: 25.0
        alt_min: 18.0
        alt_requires: {naphthalenes_vol_pct_max: 3.0}
        test_method: "ASTM D1322 / D1840"
        verification: "verified"  # user checked D1655 Table 1 against the standard 2026-11-14
        uncertainty_margin: null  # model skill vs constant baseline not established (results/v4/SP)
      # v5 WS7 (delta_ws7_design_realism): D86 limits, used ONLY with engine_v4.load_spec(..., d86=True) (applies_to: d86_design).
      # D1655 Table 1 (T10 <= 205 C, FBP <= 300 C) and D7566 Table 1 (T50-T10 >= 15 C, T90-T10 >= 40 C): secondary sources only, standard text not read.
      distillation_T10_C:
        max: 205.0
        test_method: "ASTM D86"
        source: "D1655 Table 1 (secondary)"
        verification: secondary_sources_only
        applies_to: d86_design
      distillation_FBP_C:
        max: 300.0
        test_method: "ASTM D86"
        source: "D1655 Table 1 (secondary)"
        verification: secondary_sources_only
        applies_to: d86_design
      distillation_T50_minus_T10_C:
        min: 15.0
        test_method: "ASTM D86"
        source: "D7566 Table 1 (secondary)"
        verification: secondary_sources_only
        applies_to: d86_design
      distillation_T90_minus_T10_C:
        min: 40.0
        test_method: "ASTM D86"
        source: "D7566 Table 1 (secondary)"
        verification: secondary_sources_only
        applies_to: d86_design

  diesel_no2:
    standard: "ASTM D975"
    grade: "Grade No. 2-D S15"
    constraints:
      kin_visc_40C_cSt:
        min: 1.9
        max: 4.1
        test_method: "ASTM D445"
        uncertainty_margin_factor: 1.25
      density_15C_kg_m3:
        min: 820.0
        max: 860.0
        test_method: "ASTM D4052"
        uncertainty_margin: 8.0
      flash_point_C:
        min: 52.0
        test_method: "ASTM D93"
        uncertainty_margin: 4.2
      dcn:
        min: 40.0
        test_method: "ASTM D6890 / D613"
        uncertainty_margin: 5.5
      cloud_point_C:
        max: -5.0
        test_method: "ASTM D2500"
        uncertainty_margin: 3.5
      aromatics_wt_pct:
        max: 35.0
        test_method: "ASTM D1319"

  gasoline:
    standard: "ASTM D4814"
    grade: "Regular Unleaded (Class AA / A)"
    constraints:
      ron:
        min: 87.0
        test_method: "ASTM D2699"
        uncertainty_margin: 3.5
      mon:
        min: 82.0
        test_method: "ASTM D2700"
        uncertainty_margin: 3.5
      density_15C_kg_m3:
        min: 720.0
        max: 775.0
        test_method: "ASTM D4052"
        uncertainty_margin: 8.0
      dvpe_kPa:
        min: 45.0
        max: 70.0
        test_method: "ASTM D5191"
        uncertainty_margin: 5.0
      distillation_T50_C:
        min: 77.0
        max: 121.0
        test_method: "ASTM D86"
