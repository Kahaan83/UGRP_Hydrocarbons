# Optuna search spaces (plan Task 9). type: float|int|cat; log: true for log-uniform.
dmpnn:
  fixed: {epochs: 1000, patience: 100}
  params:
    hidden:    {type: int, low: 100, high: 600, log: true}
    depth:     {type: int, low: 2, high: 6}
    dropout:   {type: float, low: 0.0, high: 0.4}
    lr:        {type: float, low: 1.0e-4, high: 3.0e-3, log: true}
    wd:        {type: float, low: 1.0e-6, high: 1.0e-3, log: true}
    bs:        {type: cat, choices: [32, 64, 128]}
    scheduler: {type: cat, choices: [none, plateau, cosine]}
molpool:
  fixed: {epochs: 2000, patience: 150}
  params:
    d:       {type: int, low: 4, high: 32}
    rank:    {type: int, low: 2, high: 16}
    hidden:  {type: int, low: 16, high: 128}
    wd:      {type: float, low: 1.0e-3, high: 1.0, log: true}
    lr:      {type: float, low: 3.0e-4, high: 1.0e-2, log: true}
    dropout: {type: float, low: 0.0, high: 0.3}
lgbm:
  fixed: {n_estimators: 5000, early_stopping_rounds: 100}
  params:
    num_leaves:        {type: int, low: 3, high: 31}
    min_child_samples: {type: int, low: 5, high: 60}
    learning_rate:     {type: float, low: 0.01, high: 0.2, log: true}
    subsample:         {type: float, low: 0.5, high: 1.0}
    colsample:         {type: float, low: 0.5, high: 1.0}
    lambda_l2:         {type: float, low: 1.0e-3, high: 10.0, log: true}
