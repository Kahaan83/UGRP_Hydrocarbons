fuels:
  posf10325:
    name: A-2 POSF10325 Jet A
    category: Conventional
    source: Edwards et al. (2020)
    reference: https://apps.dtic.mil/sti/pdfs/AD1093317.pdf
    description: Baseline fuel from NJFCP. Average density, average viscosity, and
      average flash point.
  posf11498:
    name: C-1 POSF11498 ATJ
    category: SATF
    source: Edwards et al. (2020)
    reference: https://apps.dtic.mil/sti/pdfs/AD1093317.pdf
    description: Atypical alternative fuel from NJFCP. Isoparaffinic-only with low
      density, average viscosity, and a flat distillation curve.
